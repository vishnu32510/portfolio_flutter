name: Deploy Wedding E-Invite Preview on PR
on:
  pull_request:
    branches:
      - main
      - invitation
    types:
      - opened
      - synchronize
      - reopened
permissions:
  checks: write
  contents: read
  pull-requests: write

jobs:
  build_and_preview:
    if: |
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.event.pull_request.merged == false
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build production bundle
        run: npm run build

      - name: Deploy preview to Firebase Hosting
        uses: FirebaseExtended/action-hosting-deploy@v0
        with:
          repoToken: '${{ secrets.GITHUB_TOKEN }}'
          firebaseServiceAccount: '${{ secrets.FIREBASE_SERVICE_ACCOUNT_VISHNUPRIYAN_SS }}'
          projectId: vishnupriyan-ss
          target: wedding

