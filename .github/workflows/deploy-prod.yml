# This file was auto-generated by the Firebase CLI
# https://github.com/firebase/firebase-tools

name: Deploy to Firebase Hosting on main
on:
  push:
    branches:
      - main
    # This triggers on:
    # - Direct pushes to main
    # - Merges to main (GitHub automatically creates a push event when PR is merged)

jobs:
  build_and_deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version-file: flutter-version.txt
          channel: 'stable'
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Build Flutter web
        run: flutter build web --release --wasm --no-tree-shake-icons

      - name: Deploy to Firebase Hosting
        uses: FirebaseExtended/action-hosting-deploy@v0
        with:
          repoToken: '${{ secrets.GITHUB_TOKEN }}'
          firebaseServiceAccount: '${{ secrets.FIREBASE_SERVICE_ACCOUNT_VISHNUPRIYAN_SS }}'
          channelId: live
          projectId: vishnupriyan-ss

      - name: Tag Release
        if: success()
        run: |
          VERSION=$(grep '^version:' pubspec.yaml | awk '{print $2}')
          TIMESTAMP=$(date +'%Y%m%d%H%M%S')
          TAG_NAME="web-prod-v${VERSION}-${TIMESTAMP}"

          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git tag -a "$TAG_NAME" -m "Release $TAG_NAME"
          git push origin "$TAG_NAME"
