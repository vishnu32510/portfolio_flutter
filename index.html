    <!-- Google Analytics 4 (GA4) - Mirrors Vishnu's Portfolio App -->
    <script>
      (function() {
        var hostname = window.location.hostname;
        // Do not track localhost, 127.0.0.1, or PR preview channels to keep visitor counts pure
        var isPreview = hostname === 'localhost' ||
                        hostname === '127.0.0.1' ||
                        hostname.includes('--pr-') ||
                        (hostname.includes('web.app') && hostname.includes('--')) ||
                        (hostname.includes('firebaseapp.com') && hostname.includes('--'));

        var gaMeasurementId = 'G-G4C2K609VC';

        if (!isPreview && gaMeasurementId) {
          var script = document.createElement('script');
          script.async = true;
          script.src = 'https://www.googletagmanager.com/gtag/js?id=' + gaMeasurementId;
          document.head.appendChild(script);

          window.dataLayer = window.dataLayer || [];
          function gtag(){dataLayer.push(arguments);}
          window.gtag = gtag;
          gtag('js', new Date());
          gtag('config', gaMeasurementId, {
            send_page_view: true,
            cookie_flags: 'SameSite=None;Secure'
          });
        } else {
          // Safe stub on local dev / preview channels so calls do not throw errors
          window.dataLayer = window.dataLayer || [];
          window.gtag = function() {
            if (hostname === 'localhost' || hostname === '127.0.0.1') {
              console.log('[Analytics Dev]', Array.prototype.slice.call(arguments));
            }
          };
        }
      })();
    </script>
